<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevGraph</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
            color: #d1d5db;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        input {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 8px;
        }

        button:hover {
            opacity: 0.9;
        }

        .profile {
            margin-top: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin: 8px 0;
        }

        #error {
            color: red;
            margin-top: 15px;
        }

        #loading {
            margin-top: 15px;
        }

        .graph-card {
            background: white;
            margin-top: 25px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        #graph {
            width: 100%;
            height: 550px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 15px;
            background: #fafafa;
        }

        .legend {
            margin-top: 15px;
            font-size: 14px;
        }

        .legend span {
            margin-right: 20px;
        }

        @media (max-width: 700px) {
            .profile {
                grid-template-columns: 1fr;
            }

            input {
                width: 100%;
                margin-bottom: 10px;
            }

            button {
                margin-left: 0;
            }
        }
    </style>

    <!-- D3.js -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

</head>

<body>

    <header>

        <h1>🚀 DevGraph</h1>

        <p>
            Graph-powered Developer Profile
        </p>

    </header>


    <div class="container">

        <!-- Search -->

        <div class="search-box">

            <h2>🔎 Find Developer</h2>

            <input
                type="text"
                id="userName"
                value="Aftab Lone"
                placeholder="Enter user name"
            >

            <button onclick="loadProfile()">
                Load Profile
            </button>

            <div id="loading"></div>

            <div id="error"></div>

        </div>


        <!-- Profile -->

        <div id="profile" class="profile"></div>


        <!-- Graph -->

        <div class="graph-card">

            <h2>🕸️ Developer Graph</h2>

            <p>
                User relationships stored in CognoDB
            </p>

            <div id="graph"></div>

            <div class="legend">

                <span>👤 User</span>
                <span>🛠️ Skill</span>
                <span>📁 Project</span>

            </div>

        </div>

    </div>


    <script>

        const API_URL = "http://localhost:8002";


        async function loadProfile() {

            const userName =
                document.getElementById("userName").value.trim();

            const profile =
                document.getElementById("profile");

            const error =
                document.getElementById("error");

            const loading =
                document.getElementById("loading");


            profile.innerHTML = "";
            error.innerHTML = "";
            loading.innerHTML = "";


            if (!userName) {

                error.innerText =
                    "Please enter a user name.";

                return;
            }


            loading.innerText =
                "Loading profile...";


            try {

                const response = await fetch(
                    `${API_URL}/users/${encodeURIComponent(userName)}`
                );


                if (!response.ok) {

                    throw new Error(
                        "User not found"
                    );
                }


                const data =
                    await response.json();


                loading.innerText = "";


                displayProfile(data);

                drawGraph(data);

            }

            catch (err) {

                loading.innerText = "";

                error.innerText =
                    "Error: " + err.message;

                document.getElementById("graph").innerHTML = "";

            }

        }


        function displayProfile(data) {

            const profile =
                document.getElementById("profile");


            profile.innerHTML = `

                <div class="card">

                    <h2>👤 Developer</h2>

                    <h3>${data.name}</h3>

                    <p>
                        <strong>Role:</strong>
                        ${data.role}
                    </p>

                </div>


                <div class="card">

                    <h2>🛠️ Skills</h2>

                    <ul>

                        ${
                            data.skills.length
                            ? data.skills.map(
                                skill => `<li>${skill}</li>`
                              ).join("")
                            : "<li>No skills found</li>"
                        }

                    </ul>

                </div>


                <div class="card">

                    <h2>📁 Projects</h2>

                    <ul>

                        ${
                            data.projects.length
                            ? data.projects.map(
                                project => `<li>${project}</li>`
                              ).join("")
                            : "<li>No projects found</li>"
                        }

                    </ul>

                </div>

            `;

        }


        function drawGraph(data) {

            const graph =
                document.getElementById("graph");


            graph.innerHTML = "";


            const width =
                graph.clientWidth;

            const height =
                graph.clientHeight;


            const nodes = [];

            const links = [];


            // User node

            nodes.push({
                id: data.name,
                label: data.name,
                type: "user"
            });


            // Skill nodes

            data.skills.forEach(skill => {

                nodes.push({
                    id: "skill-" + skill,
                    label: skill,
                    type: "skill"
                });

                links.push({
                    source: data.name,
                    target: "skill-" + skill,
                    relationship: "KNOWS"
                });

            });


            // Project nodes

            data.projects.forEach(project => {

                nodes.push({
                    id: "project-" + project,
                    label: project,
                    type: "project"
                });

                links.push({
                    source: data.name,
                    target: "project-" + project,
                    relationship: "WORKED_ON"
                });

            });


            const svg =
                d3.select("#graph")
                  .append("svg")
                  .attr("width", width)
                  .attr("height", height);


            const simulation =
                d3.forceSimulation(nodes)

                    .force(
                        "link",
                        d3.forceLink(links)
                            .id(d => d.id)
                            .distance(150)
                    )

                    .force(
                        "charge",
                        d3.forceManyBody()
                            .strength(-500)
                    )

                    .force(
                        "center",
                        d3.forceCenter(
                            width / 2,
                            height / 2
                        )
                    );


            const link =
                svg.append("g")
                   .selectAll("line")
                   .data(links)
                   .enter()
                   .append("line")
                   .attr("stroke", "#999")
                   .attr("stroke-width", 2);


            const linkLabel =
                svg.append("g")
                   .selectAll("text")
                   .data(links)
                   .enter()
                   .append("text")
                   .text(d => d.relationship)
                   .attr("font-size", "11px")
                   .attr("text-anchor", "middle");


            const node =
                svg.append("g")
                   .selectAll("circle")
                   .data(nodes)
                   .enter()
                   .append("circle")
                   .attr("r", d => {

                       if (d.type === "user") {
                           return 28;
                       }

                       return 20;

                   })
                   .attr("fill", d => {

                       if (d.type === "user") {
                           return "#2563eb";
                       }

                       if (d.type === "skill") {
                           return "#16a34a";
                       }

                       return "#9333ea";

                   })
                   .call(
                       d3.drag()
                           .on("start", dragstarted)
                           .on("drag", dragged)
                           .on("end", dragended)
                   );


            const label =
                svg.append("g")
                   .selectAll("text")
                   .data(nodes)
                   .enter()
                   .append("text")
                   .text(d => d.label)
                   .attr("font-size", "13px")
                   .attr("text-anchor", "middle")
                   .attr("dy", 40);


            simulation.on(
                "tick",
                () => {

                    link
                        .attr(
                            "x1",
                            d => d.source.x
                        )
                        .attr(
                            "y1",
                            d => d.source.y
                        )
                        .attr(
                            "x2",
                            d => d.target.x
                        )
                        .attr(
                            "y2",
                            d => d.target.y
                        );


                    linkLabel
                        .attr(
                            "x",
                            d => (
                                d.source.x +
                                d.target.x
                            ) / 2
                        )
                        .attr(
                            "y",
                            d => (
                                d.source.y +
                                d.target.y
                            ) / 2
                        );


                    node
                        .attr(
                            "cx",
                            d => d.x
                        )
                        .attr(
                            "cy",
                            d => d.y
                        );


                    label
                        .attr(
                            "x",
                            d => d.x
                        )
                        .attr(
                            "y",
                            d => d.y
                        );

                }
            );


            function dragstarted(event, d) {

                if (!event.active) {
                    simulation.alphaTarget(0.3).restart();
                }

                d.fx = d.x;
                d.fy = d.y;

            }


            function dragged(event, d) {

                d.fx = event.x;
                d.fy = event.y;

            }


            function dragended(event, d) {

                if (!event.active) {
                    simulation.alphaTarget(0);
                }

                d.fx = null;
                d.fy = null;

            }

        }


        // Automatically load Aftab's profile

        window.addEventListener(
            "load",
            loadProfile
        );

    </script>

</body>

</html>
